[project]
name = "gpu-compute-index"
version = "0.1.0"
description = "Open, auditable daily price index for GPU compute"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gpu-index = "gpu_index.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
